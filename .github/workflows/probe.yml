name: probe
on: push
jobs:
  probe:
    if: github.ref == 'refs/heads/claude/project-thread-4et7kn'
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          curl -sS -A "$UA" -o rw.html https://status.railway.com/
          wc -c rw.html
          grep -o -i '.\{200\}partial.\{200\}' rw.html | head -8
          echo ===; grep -o -i '.\{300\}backboard.\{300\}' rw.html | head -4
          echo ===; grep -o -i 'all systems[^<]\{0,80\}\|operational[^<]\{0,40\}\|degraded[^<]\{0,40\}\|outage[^<]\{0,40\}' rw.html | sort | uniq -c | head -20
