name: probe
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for p in summary.json v2/components.json history.rss; do
            curl -sS -L -m 30 -A "downagain.dev status reader" -o body "https://status.northflank.com/$p"
            echo "FILE $p $(base64 -w0 body)"
          done
